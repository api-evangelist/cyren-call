name: Cyren Call
description: Cyren Call Communications Corp. was a wireless communications company founded in 2005 by
  Nextel co-founder Morgan O'Brien to advocate for a nationwide public-safety broadband network. Its
  central proposal asked the FCC to reallocate 30 MHz of 700 MHz-band spectrum (freed by the 2009
  analog-TV shutdown) to public-safety users, and it later served as advisor to the Public Safety
  Spectrum Trust (PSST) after PSST became the nationwide licensee for public safety's 10 MHz of 700
  MHz broadband spectrum. The FCC dismissed Cyren Call's original petition as inconsistent with
  auction requirements, and the PSST advisory relationship ended in early 2009. The company is
  permanently closed. It never operated a developer program, public API, or SDK surface, so no API
  artifacts are available for enrichment.
